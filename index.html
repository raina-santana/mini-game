<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detetives da Internet 🕵️‍♂️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Detetives da Internet</h1>
      <p class="subtitle">Aprenda a se proteger online!</p>
    </header>

    <section id="start-screen">
      <div class="mascot" aria-hidden="true">🕵️‍♂️</div>
      <p class="mission">Chegaram 10 casos na sua mesa. Use o faro de detetive para não cair em nenhum golpe!</p>
      <button id="start-btn" class="btn">Abrir os casos 🔍</button>
    </section>

    <section id="quiz-box" class="folder" hidden>
      <div class="folder-tab" id="case-counter"></div>
      <div id="progress-container" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar"></div>
      </div>

      <p id="story" class="story"></p>
      <h2 id="question" tabindex="-1"></h2>
      <div id="answers"></div>

      <p id="feedback" aria-live="polite"></p>
      <button id="next-btn" class="btn" hidden>Próximo caso ➡️</button>
    </section>

    <section id="result" class="folder" hidden>
      <div class="folder-tab">Relatório final</div>
      <div class="medal" id="result-emoji" aria-hidden="true"></div>
      <h2 id="result-title"></h2>
      <p id="result-score"></p>
      <p id="result-text"></p>
      <button id="restart-btn" class="btn">Jogar de novo 🔄</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
